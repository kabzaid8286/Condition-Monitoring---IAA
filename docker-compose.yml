version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: condition_monitoring_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: condition_monitoring
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: condition_monitoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: condition_monitoring_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  timescale_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
